<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>裁判手机控制台</title><link rel="stylesheet" href="style.css"></head><body><div class="wrap">
<header class="bar"><div class="brand">📱 裁判控制台<div class="small">REFEREE MOBILE CONTROL</div></div><span class="pill" id="conn">等待连接</span></header>
<section class="card login" id="login"><div class="eyebrow">REFEREE SIGN IN</div><h2>裁判登录</h2><div class="field"><label>电邮</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密码</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" style="width:100%">登录</button><p class="status" id="loginStatus"></p></section>
<main id="control" class="hidden">
<section class="card"><div class="eyebrow">SELECT MATCH · 选择场次</div><div class="field"><select id="matchSelect"></select></div><button class="alt" id="logout">退出登录</button></section>
<section class="card" style="margin-top:14px"><div class="eyebrow">LIVE SCORE · 输入比分</div><h2 id="matchTitle">第 1 场</h2><div class="scoregrid">
<div class="team"><div class="eyebrow">BOYS · 男生组</div><div class="teamname" id="boys">—</div><div class="actions"><input class="scoreInput" id="ba" type="number" min="0" max="99"><input class="scoreInput" id="bb" type="number" min="0" max="99"></div><div class="actions"><button class="alt" data-key="ba" data-d="-1">−</button><button data-key="ba" data-d="1">左队 +1</button><button class="alt" data-key="bb" data-d="-1">−</button><button data-key="bb" data-d="1">右队 +1</button></div></div>
<div class="team"><div class="eyebrow">GIRLS · 女生组</div><div class="teamname" id="girls">—</div><div class="actions"><input class="scoreInput" id="ga" type="number" min="0" max="99"><input class="scoreInput" id="gb" type="number" min="0" max="99"></div><div class="actions"><button class="alt" data-key="ga" data-d="-1">−</button><button data-key="ga" data-d="1">左队 +1</button><button class="alt" data-key="gb" data-d="-1">−</button><button data-key="gb" data-d="1">右队 +1</button></div></div></div><div class="actions"><button id="saveScore" style="width:100%">保存并同步比分</button></div></section>
<section class="card" style="margin-top:14px"><div class="eyebrow">MATCH TIMER · 比赛计时</div><div class="timer" id="timer">10:00</div><div class="field"><label>每场分钟数</label><input id="duration" type="number" min="1" max="180"></div><div class="actions"><button id="start">▶ 开始</button><button class="alt" id="pause">Ⅱ 暂停</button><button class="warn" id="reset">↺ 重置</button></div><p class="status" id="timerStatus">准备开始</p></section>
<section class="card" style="margin-top:14px"><div class="eyebrow">EDIT SCHEDULE · 编辑赛程</div><div id="editList"></div><button id="saveSchedule" style="width:100%;margin-top:10px">保存并同步赛程</button></section>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const $=x=>document.getElementById(x);let db,state,user,sub,entering=false;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const idx=()=>Number($("matchSelect").value||0),num=id=>Math.max(0,Math.min(99,parseInt($(id).value,10)||0));
const rem=()=>!state?600:state.timerRunning&&state.timerEndsAt?Math.max(0,Math.ceil((state.timerEndsAt-Date.now())/1000)):Number(state.timerRemaining??state.duration*60);
const fmt=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function render(){if(!state)return;let i=idx(),m=state.matches[i],s=state.scores?.[i]||{};$("matchSelect").innerHTML=state.matches.map((x,j)=>`<option value="${j}" ${i===j?"selected":""}>第 ${j+1} 场 · ${esc(x.t)} · ${esc(x.b)} / ${esc(x.g)}</option>`).join("");$("matchTitle").textContent=`第 ${i+1} 场 · ${m.t}`;$("boys").textContent=m.b;$("girls").textContent=m.g;["ba","bb","ga","gb"].forEach(k=>$(k).value=s[k]||0);$("duration").value=state.duration;$("timer").textContent=fmt(rem());$("timerStatus").textContent=state.timerRunning?"正在计时":state.timerStatus;
$("editList").innerHTML=state.matches.map((x,j)=>`<div class="card" style="padding:12px;margin:9px 0"><b>第 ${j+1} 场</b><div class="field"><label>时间</label><input data-i="${j}" data-f="t" value="${esc(x.t)}"></div><div class="field"><label>男生对阵</label><input data-i="${j}" data-f="b" value="${esc(x.b)}"></div><div class="field"><label>女生对阵</label><input data-i="${j}" data-f="g" value="${esc(x.g)}"></div></div>`).join("")}
async function push(){let {error}=await db.from("tournament_state").update({data:state,updated_at:new Date().toISOString()}).eq("id",1);if(error)alert("同步失败："+error.message);else $("conn").textContent="● 已同步"}
async function enter(){if(entering)return;entering=true;try{let {data,error}=await db.from("tournament_state").select("data").eq("id",1).single();if(error)throw error;state=data.data;$("login").classList.add("hidden");$("control").classList.remove("hidden");$("conn").textContent="● 已连接";render();if(sub)await db.removeChannel(sub);sub=db.channel("referee-updates").on("postgres_changes",{event:"UPDATE",schema:"public",table:"tournament_state",filter:"id=eq.1"},p=>{let old=idx();state=p.new.data;render();$("matchSelect").value=String(Math.min(old,state.matches.length-1))}).subscribe()}catch(e){$("loginStatus").textContent=e.message}finally{entering=false}}
async function init(){let c=window.TOURNAMENT_CONFIG||{};if(!c.supabaseUrl||c.supabaseUrl.includes("YOUR-")||!c.supabaseAnonKey||c.supabaseAnonKey.includes("YOUR_")){$("loginStatus").textContent="请先填写 config.js 中的 Supabase 项目资料";return}db=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);let {data:{session}}=await db.auth.getSession();if(session){user=session.user;await enter()}db.auth.onAuthStateChange(async(e,s)=>{if(s){user=s.user;await enter()}else{$("login").classList.remove("hidden");$("control").classList.add("hidden")}})}
$("loginBtn").onclick=async()=>{let {error}=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error)$("loginStatus").textContent=error.message};
$("logout").onclick=()=>db.auth.signOut();
$("matchSelect").onchange=async()=>{state.selected=idx();state.timerRunning=false;state.timerEndsAt=null;state.timerRemaining=state.duration*60;state.timerStatus="已切换场次";await push();render()};
document.querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>{$(b.dataset.key).value=Math.max(0,Math.min(99,num(b.dataset.key)+Number(b.dataset.d)))});
$("saveScore").onclick=async()=>{state.scores=state.scores||{};state.scores[idx()]={ba:num("ba"),bb:num("bb"),ga:num("ga"),gb:num("gb")};await push()};
$("duration").onchange=async()=>{state.duration=Math.max(1,Math.min(180,parseInt($("duration").value,10)||10));state.timerRunning=false;state.timerEndsAt=null;state.timerRemaining=state.duration*60;state.timerStatus="时长已调整";await push();render()};
$("start").onclick=async()=>{let r=rem()||state.duration*60;state.timerRemaining=r;state.timerEndsAt=Date.now()+r*1000;state.timerRunning=true;state.timerStatus="正在计时";await push();render()};
$("pause").onclick=async()=>{state.timerRemaining=rem();state.timerRunning=false;state.timerEndsAt=null;state.timerStatus="已暂停";await push();render()};
$("reset").onclick=async()=>{state.timerRunning=false;state.timerEndsAt=null;state.timerRemaining=state.duration*60;state.timerStatus="已重置";await push();render()};
$("saveSchedule").onclick=async()=>{document.querySelectorAll("#editList input").forEach(e=>state.matches[Number(e.dataset.i)][e.dataset.f]=e.value.trim());await push();render()};
setInterval(()=>{if(state)$("timer").textContent=fmt(rem())},400);init();
</script></body></html>
