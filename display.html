<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>躲避球礼堂大屏</title><link rel="stylesheet" href="style.css"></head><body><div class="wrap">
<header class="bar"><div class="brand">🏐 躲避球比赛指挥中心<div class="small">DODGEBALL LIVE SCOREBOARD</div></div><div style="text-align:right"><div class="clock" id="clock">--:--:--</div><div class="small" id="date"></div></div></header>
<div class="grid"><main>
<section class="card"><div class="eyebrow">MATCH COUNTDOWN · 比赛倒计时</div><div class="timer" id="timer">10:00</div><div class="status" id="timerStatus">等待连接…</div><div class="small" id="duration"></div></section>
<section class="card" style="margin-top:14px"><div class="eyebrow">LIVE MATCH · 当前比赛</div><div class="matchTitle" id="title">等待赛程资料…</div><div class="scoregrid"><div class="team"><div class="eyebrow">BOYS · 男生组</div><div class="teamname" id="boys">—</div><div class="score" id="bs">0 : 0</div></div><div class="team"><div class="eyebrow">GIRLS · 女生组</div><div class="teamname" id="girls">—</div><div class="score" id="gs">0 : 0</div></div></div></section>
</main><aside class="card"><div class="bar"><h2>完整赛程</h2><span class="pill" id="conn">连接中</span></div><div class="schedule" id="schedule"></div><p class="small">比分与赛程由裁判手机实时更新。</p></aside></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const $=x=>document.getElementById(x);let db,state;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rem=()=>!state?600:state.timerRunning&&state.timerEndsAt?Math.max(0,Math.ceil((state.timerEndsAt-Date.now())/1000)):Number(state.timerRemaining??state.duration*60);
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function render(){if(!state)return;let i=state.selected||0,m=state.matches[i],s=state.scores?.[i]||{};if(!m)return;
$("title").textContent=`第 ${m.n} 场 · ${m.t}`;$("boys").textContent=m.b;$("girls").textContent=m.g;$("bs").textContent=`${s.ba||0} : ${s.bb||0}`;$("gs").textContent=`${s.ga||0} : ${s.gb||0}`;$("duration").textContent=`每场 ${state.duration} 分钟`;$("timerStatus").textContent=state.timerRunning?"● 正在计时":state.timerStatus;
$("schedule").innerHTML=state.matches.map((x,j)=>{let z=state.scores?.[j]||{};return `<div class="match ${j===i?"active":""}"><b style="color:var(--cyan)">${String(j+1).padStart(2,"0")}</b><b style="color:var(--orange)">${esc(x.t)}</b><div class="small">男 ${esc(x.b)} <b style="color:var(--lime)">${z.ba||0}:${z.bb||0}</b><br>女 ${esc(x.g)} <b style="color:var(--lime)">${z.ga||0}:${z.gb||0}</b></div></div>`}).join("")}
async function init(){let c=window.TOURNAMENT_CONFIG||{};if(!c.supabaseUrl||c.supabaseUrl.includes("YOUR-")||!c.supabaseAnonKey||c.supabaseAnonKey.includes("YOUR_")){$("conn").textContent="尚未配置";return}db=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);let {data,error}=await db.from("tournament_state").select("data").eq("id",1).single();if(error){$("conn").textContent="连接失败";$("timerStatus").textContent=error.message;return}state=data.data;render();$("conn").textContent="● 实时连接";db.channel("live-board").on("postgres_changes",{event:"UPDATE",schema:"public",table:"tournament_state",filter:"id=eq.1"},p=>{state=p.new.data;render()}).subscribe(s=>{if(s==="SUBSCRIBED")$("conn").textContent="● 实时同步"})}
function clock(){let d=new Date();$("clock").textContent=d.toLocaleTimeString("en-GB",{hour12:false});$("date").textContent=d.toLocaleDateString("zh-CN",{year:"numeric",month:"long",day:"numeric",weekday:"long"});$("timer").textContent=fmt(rem())}
setInterval(clock,250);clock();init();
</script></body></html>
